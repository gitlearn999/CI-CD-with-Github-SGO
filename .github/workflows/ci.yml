name: CI

on: # trigger
  workflow_dispatch: # manual button to run this workflow

  push:
    branches:
    - main  

    paths:
      - 'src/**'    

permissions:
  contents: read      

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Show trigger
        run: echo "Triggered by ${{ github.event_name }}"

      - name: Run tests
        run: echo "Tests passed"

  build:
    needs: test

    permissions:
      contents: read
      packages: write    

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build application
        run: |
          mkdir -p dist
          cp src/index.html dist/index.html

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          retention-days: 7
          
  deploy-demo:
    needs: build
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    env:
      REGION: ${{ vars.DEPLOY_REGION }}    

    steps:
      - name: Verify deployment token
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "A deployment token was provided"
          test -n "$TOKEN"
    
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: ./dist

      - name: Show deployment configuration
        run: echo "Deploying to $REGION"          

      - name: Inspect build output
        run: |
          ls -R dist
          cat dist/index.html

      - name: Deploy
        run: echo "Deploying application"
